<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1055;
        }
    </style>
</head>
<body>

<div class="card login-card shadow">
    <div class="card-body">
        <h3 class="card-title text-center mb-4">Iniciar sesión</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario:</label>
                <input type="text" id="username" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" id="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Ingresar</button>
        </form>

        <a href="/web/registro" class="btn btn-success w-100 mb-2">
            <i class="fas fa-user-plus"></i> Registrarse
        </a>
        <a href="/oauth2/authorization/github" class="btn btn-dark w-100">
            <i class="fab fa-github"></i> Iniciar sesión con GitHub
        </a>
    </div>
</div>

<!-- Toast para notificación -->
<div class="toast-container">
    <div id="loginToast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                Login exitoso!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const loginData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        fetch('http://localhost:8080/auth/log-in', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify(loginData)
        })
        .then(response => {
            if (response.ok) {
                const toastEl = new bootstrap.Toast(document.getElementById('loginToast'));
                toastEl.show();
                setTimeout(() => {
                    window.location.href = "/web/home";
                }, 1500); // espera a que se vea la notificación
            } else {
                alert("Login incorrecto");
            }
        });
    });
</script>

</body>
</html>
