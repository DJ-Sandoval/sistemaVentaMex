<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .btn-purple {
            background-color: #6f42c1;
            color: white;
        }
        .btn-purple:hover {
            background-color: #5a32a3;
            color: white;
        }
        .concepto-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .total-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        tr {
    transition: all 0.3s ease;
}

/* Estilo para el botón durante carga */
.btn-eliminando {
    position: relative;
    padding-left: 2.5rem;
}

.btn-eliminando .spinner-border {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
}
        .pagination {
    margin: 20px 0;
}
.page-item.active .page-link {
    background-color: #6f42c1;
    border-color: #6f42c1;
}
.page-link {
    color: #6f42c1;
}
      #searchInput {
    max-width: 300px;
    display: inline-block;
}
        /* Reducir el tamaño de la tabla */
        .table-responsive {
            max-width: 90%; /* Limitar el ancho de la tabla */
            margin: 0 auto; /* Centrar la tabla */
            overflow-x: auto;
        }

        table {
            font-size: 0.85rem; /* Reducir el tamaño de la fuente */
        }

        th, td {
            padding: 0.5rem; /* Reducir el padding de las celdas */
        }

    </style>
</head>
<body>
<br>
<div class="text-center mb-4">
    <h3>Listado de Ventas</h3>
</div>
<br>
<div class="d-flex justify-content-center mb-4">
    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Buscar..." style="max-width: 300px;">
    <button id="searchButton" class="btn btn-primary btn-sm ms-2">Buscar</button>
</div>

<div class="container mt-5">
    <div class="d-flex justify-content-center gap-2 mb-4">
        <div>
            <button type="button" class="btn btn-purple" data-bs-toggle="modal" data-bs-target="#ventaModal">
                <i class="fas fa-plus-circle"></i> Nueva Venta
            </button>
        </div>
        <div>
            <button class="btn btn-secondary me-2" id="btnInicio">
                <i class="fas fa-home"></i> Inicio
            </button>
            <button class="btn btn-danger me-2" id="btnReportePDF">
                <i class="fas fa-file-pdf"></i> PDF
            </button>
            <button class="btn btn-success me-2" id="btnReporteExcel">
                <i class="fas fa-file-excel"></i> Excel
            </button>
            <button class="btn btn-info" id="btnHistorial">
                <i class="fas fa-history"></i> Historial
            </button>
        </div>
    </div>


    <!-- Tabla de ventas -->
     <div class="table-responsive mt-4" style="max-width: 100%; overflow-x: auto;">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="ventasTableBody">
            <!-- Las ventas se cargarán dinámicamente aquí -->
            </tbody>
        </table>
        <div id="paginador" class="mt-4 text-center"></div>
    </div>


    <!-- Modal para nueva venta -->
    <div class="modal fade" id="ventaModal" tabindex="-1" aria-labelledby="ventaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ventaModalLabel">Nueva Venta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="ventaForm">
                        <!-- Cliente -->
                        <div class="mb-3">
                            <label for="clienteId" class="form-label">Cliente ID</label>
                            <input type="number" class="form-control" id="clienteId" required>
                        </div>

                        <!-- Producto -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="productoId" class="form-label">Producto ID</label>
                                <input type="number" class="form-control" id="productoId" required>
                            </div>
                            <div class="col-md-3">
                                <label for="cantidad" class="form-label">Cantidad</label>
                                <input type="number" class="form-control" id="cantidad" min="1" value="1" required>
                            </div>
                            <div class="col-md-3">
                                <label for="importe" class="form-label">Importe</label>
                                <input type="number" class="form-control" id="importe" readonly>
                            </div>
                        </div>

                        <!-- Botón para agregar concepto -->
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary" id="agregarConcepto">
                                <i class="fas fa-plus"></i> Agregar Concepto
                            </button>
                        </div>

                        <!-- Lista de conceptos -->
                        <div class="mb-3">
                            <h5>Conceptos</h5>
                            <div id="conceptosContainer" class="mt-3">
                                <!-- Los conceptos se agregarán aquí dinámicamente -->
                            </div>
                        </div>

                        <!-- Total -->
                        <div class="total-section">
                            <h5>Total: <span id="totalVenta">0.00</span></h5>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="guardarVenta">Guardar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS y dependencias -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    // Funciones globales para el spinner
    function mostrarSpinner() {
        $('#loadingSpinner').show();
    }

    function ocultarSpinner() {
        $('#loadingSpinner').hide();
    }

    // Función para cargar las ventas
    function cargarVentas(page = 0, size = 5, search = "") {
        mostrarSpinner();
        $.get(`/api/ventas?page=${page}&size=${size}&search=${search}`)
            .done(function(data) {
                $('#ventasTableBody').empty();

                if (data.content && data.content.length > 0) {
                    data.content.forEach(venta => {
                        $('#ventasTableBody').append(`
                            <tr>
                                <td>${venta.id}</td>
                                <td>${new Date(venta.fecha).toLocaleString()}</td>
                                <td>${venta.clienteNombre || 'Sin nombre'}</td>
                                <td>$${(venta.total || 0).toFixed(2)}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm eliminarVenta" data-id="${venta.id}">
                                        <i class="fas fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        `);
                    });

                    generarPaginador(data.totalPages, page, size, search); // <--- siempre llamar
                } else {
                    $('#ventasTableBody').append('<tr><td colspan="5" class="text-center">No se encontraron ventas</td></tr>');
                    generarPaginador(1, 0, size, search); // <--- genera paginador vacío igual para no desaparecer
                }
            })
            .fail(function(error) {
                console.error('Error al cargar ventas:', error);
                $('#ventasTableBody').html('<tr><td colspan="5" class="text-center text-danger">Error al cargar ventas</td></tr>');
                generarPaginador(1, 0, size, search); // <--- genera paginador igual
            })
            .always(function() {
                ocultarSpinner();
            });
    }

    // Función para generar el paginador
    function generarPaginador(totalPages, currentPage, pageSize, search) {
        if (totalPages <= 1) {
            $('#paginador').html(''); // <--- No mostrar paginador si sólo hay una página
            return;
        }

        let paginadorHtml = '<nav><ul class="pagination justify-content-center">';

        // Botón Anterior
        paginadorHtml += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="cargarVentas(${currentPage - 1}, ${pageSize}, '${search}'); return false;">&laquo;</a>
        </li>`;

        // Páginas numeradas
        for (let i = 0; i < totalPages; i++) {
            paginadorHtml += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="cargarVentas(${i}, ${pageSize}, '${search}'); return false;">${i + 1}</a>
                </li>`;
        }

        // Botón Siguiente
        paginadorHtml += `<li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="cargarVentas(${currentPage + 1}, ${pageSize}, '${search}'); return false;">&raquo;</a>
        </li>`;

        paginadorHtml += '</ul></nav>';

        $('#paginador').html(paginadorHtml);
    }

    // Document Ready
    $(document).ready(function() {
        let conceptos = [];
        let totalVenta = 0;
        let currentPage = 0;
        let pageSize = 5;
        let currentSearch = "";

        cargarVentas(currentPage, pageSize, currentSearch);

        // Código de agregar concepto, guardar venta, eliminar venta, botones adicionales
        $('#searchButton').click(function() {
            currentSearch = $('#searchInput').val();
            cargarVentas(0, pageSize, currentSearch);
        });

        $(document).on('click', '.eliminarVenta', function() {
            const ventaId = $(this).data('id');
            const $fila = $(this).closest('tr');

            if (confirm('¿Deseas eliminar esta venta?')) {
                fetch(`/api/ventas/${ventaId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                .then(response => {
                    if (!response.ok) throw new Error('Error al eliminar');
                    $fila.fadeOut(500, function() {
                        cargarVentas(currentPage, pageSize, currentSearch);
                    });
                })
                .catch(error => console.error('Error al eliminar venta:', error));
            }
        });

        // Otros botones (Inicio, Reporte PDF, Excel, Historial)
        $('#btnInicio').click(() => window.location.href = '/web/home');
        $('#btnReportePDF').click(() => window.open('/api/ventas/reporte/pdf', '_blank'));
        $('#btnReporteExcel').click(() => window.open('/api/ventas/reporte/excel', '_blank'));
        $('#btnHistorial').click(() => window.location.href = '/ventas/historial');
    });
</script>

<script>
    $(document).ready(function () {
        let conceptos = [];
        let totalVenta = 0;

        // Obtener precio del producto al cambiar el ID o cantidad
        function actualizarImporte() {
            const productoId = $('#productoId').val();
            const cantidad = $('#cantidad').val();

            if (productoId && cantidad) {
                fetch(`/api/productos/${productoId}`)
                    .then(response => response.json())
                    .then(producto => {
                        const importe = producto.precioUnitario * cantidad;
                        $('#importe').val(importe.toFixed(2));
                    })
                    .catch(() => $('#importe').val('0.00'));
            }
        }

        $('#productoId, #cantidad').change(actualizarImporte);

        // Agregar concepto
        $('#agregarConcepto').click(function () {
            const productoId = $('#productoId').val();
            const cantidad = $('#cantidad').val();
            const importe = $('#importe').val();

            if (!productoId || !cantidad || !importe) {
                alert('Por favor complete todos los campos del producto');
                return;
            }

            fetch(`/api/productos/${productoId}`)
                .then(response => response.json())
                .then(producto => {
                    const concepto = {
                        productoId: parseInt(productoId),
                        productoNombre: producto.nombre,
                        cantidad: parseInt(cantidad),
                        precioUnitario: (importe / cantidad).toFixed(2),
                        importe: parseFloat(importe)
                    };

                    conceptos.push(concepto);
                    totalVenta += concepto.importe;
                    $('#totalVenta').text(totalVenta.toFixed(2));

                    $('#conceptosContainer').append(`
                        <div class="concepto-item">
                            <div class="row">
                                <div class="col-md-6"><strong>${concepto.productoNombre}</strong></div>
                                <div class="col-md-2">Cantidad: ${concepto.cantidad}</div>
                                <div class="col-md-2">Precio: $${concepto.precioUnitario}</div>
                                <div class="col-md-2">Importe: $${concepto.importe.toFixed(2)}</div>
                            </div>
                        </div>
                    `);

                    $('#productoId').val('');
                    $('#cantidad').val('1');
                    $('#importe').val('0.00');
                })
                .catch(error => {
                    console.error('Error al obtener producto:', error);
                });
        });

        // Guardar venta
        $('#guardarVenta').click(function () {
            const clienteId = $('#clienteId').val();

            if (!clienteId) {
                alert('Por favor ingrese el ID del cliente');
                return;
            }

            if (conceptos.length === 0) {
                alert('Debe agregar al menos un concepto');
                return;
            }

            const ventaRequest = {
                clienteId: parseInt(clienteId),
                conceptos: conceptos.map(c => ({
                    productoId: c.productoId,
                    cantidad: c.cantidad
                }))
            };

            fetch('/api/ventas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include', // 👈 ¡Aquí se envía la cookie con el JWT!
                body: JSON.stringify(ventaRequest)
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('No autorizado o error en la venta');
                })
                .then(data => {
                    alert('Venta guardada exitosamente!');
                    $('#ventaForm')[0].reset();
                    $('#conceptosContainer').empty();
                    conceptos = [];
                    totalVenta = 0;
                    $('#totalVenta').text('0.00');
                    $('#ventaModal').modal('hide');
                })
                .catch(error => {
                    console.error('Error al guardar venta:', error);
                    alert('Error: ' + error.message);
                });
        });
    });
</script>
<script>
    $(document).ready(function() {
        cargarVentas();

        // Función para cargar las ventas
        function cargarVentas() {
            mostrarSpinner();
            fetch('/api/ventas', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    const ventas = data.content; // Si usas paginación
                    const tbody = $('#ventasTableBody');
                    tbody.empty();
                    ventas.forEach(venta => {
                        tbody.append(`
                            <tr>
                                <td>${venta.id}</td>
                                <td>${new Date(venta.fecha).toLocaleString()}</td>
                                <td>${venta.clienteNombre}</td>
                                <td>$${venta.total.toFixed(2)}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm eliminarVenta" data-id="${venta.id}">
                                        <i class="fas fa-trash"></i> Eliminar
                                    </button>
                                </td>
                            </tr>
                        `);
                    });
                    ocultarSpinner();
                })
                .catch(error => {
                    console.error('Error al cargar ventas:', error);
                    ocultarSpinner();
                });
        }

        // Eliminar venta
        $(document).on('click', '.eliminarVenta', function() {
            const ventaId = $(this).data('id');
            if (confirm('¿Estás seguro de eliminar esta venta?')) {
                fetch(`/api/ventas/${ventaId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                    .then(response => {
                        if (response.ok) {
                            alert('Venta eliminada');
                            cargarVentas();
                        } else {
                            alert('Error al eliminar venta');
                        }
                    })
                    .catch(error => {
                        console.error('Error al eliminar venta:', error);
                        alert('Error al eliminar venta');
                    });
            }
        });
    });
</script>

<!-- Spinner de carga -->
<div id="loadingSpinner" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255,255,255,0.7); z-index: 1050; display: flex; align-items: center; justify-content: center;">
    <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>


</body>
</html>
