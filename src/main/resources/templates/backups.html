<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Backup Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .table-header {
        background-color: #6f42c1;
        color: white;
    }
    .modal-header {
        background-color: #6f42c1;
        color: white;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2>Database Backups</h2>
  <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#backupModal">Create New Backup</button>
  <a href="/web/home" class="btn btn-secondary me-2">
    <i class="fas fa-home me-1"></i> Volver a Inicio
  </a>
  <table class="table table-bordered">
    <thead class="table-header">
    <tr>
      <th>Backup File</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody id="backupTableBody">
    <!-- Backups will be populated by JavaScript -->
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal fade" id="backupModal" tabindex="-1" aria-labelledby="backupModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="backupModalLabel">Create Backup</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to create a new database backup?</p>
        <div id="backupStatus" class="alert" style="display: none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="createBackup()">Create Backup</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
      loadBackups();
  });

  function loadBackups() {
      fetch('/api/backup/list', {
          method: 'GET',
          credentials: 'include'
      })
      .then(response => response.json())
      .then(backups => {
          const tableBody = document.getElementById('backupTableBody');
          tableBody.innerHTML = '';
          backups.forEach(fileName => {
              const row = `
                  <tr>
                      <td>${fileName}</td>
                      <td>
                          <a href="/api/backup/download/${fileName}" class="btn btn-sm btn-success">Download</a>
                      </td>
                  </tr>
              `;
              tableBody.innerHTML += row;
          });
      })
      .catch(error => {
          console.error('Error loading backups:', error);
          showStatus('Error loading backups', 'danger');
      });
  }

  function createBackup() {
      const statusDiv = document.getElementById('backupStatus');
      statusDiv.style.display = 'none';

      fetch('/api/backup/create', {
          method: 'POST',
          credentials: 'include',
          headers: {
              'Content-Type': 'application/json'
          }
      })
      .then(response => {
          if (!response.ok) {
              throw new Error('Backup creation failed');
          }
          return response.text();
      })
      .then(data => {
          showStatus('Backup created successfully', 'success');
          loadBackups();
          setTimeout(() => {
              bootstrap.Modal.getInstance(document.getElementById('backupModal')).hide();
          }, 1000);
      })
      .catch(error => {
          showStatus('Failed to create backup: ' + error.message, 'danger');
      });
  }

  function showStatus(message, type) {
      const statusDiv = document.getElementById('backupStatus');
      statusDiv.className = `alert alert-${type}`;
      statusDiv.textContent = message;
      statusDiv.style.display = 'block';
  }
</script>
</body>
</html>
