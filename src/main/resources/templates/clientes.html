<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            color: #333333;
        }
        .table-light {
            background-color: #f8f9fa;
            color: #333333;
        }
        .table-light th {
            background-color: rgb(41, 33, 132);
            color: #ffffff;
        }
        .btn-primary {
            background-color: #1e90ff;
            border-color: #1e90ff;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #1565c0;
            border-color: #1565c0;
        }
        .modal-content {
            background-color: #ffffff;
            color: #333333;
        }
        .form-control {
            background-color: #ffffff;
            color: #333333;
            border-color: #4dabf7;
        }
        .form-control:focus {
            background-color: #ffffff;
            color: #333333;
            border-color: #1e90ff;
            box-shadow: 0 0 0 0.2rem rgba(30, 144, 255, 0.25);
        }
        .invalid-feedback {
            color: #ff6b6b;
        }
        .page-item.active .page-link {
            background-color: #1e90ff;
            border-color: #1e90ff;
            color: #ffffff;
        }
        .page-link {
            background-color: #ffffff;
            color: #4dabf7;
            border-color: #4dabf7;
        }
        .page-link:hover {
            background-color: #1565c0;
            color: #ffffff;
        }
        .pagination {
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <!-- Título -->
    <h1 class="text-center mb-4">Lista de Clientes</h1>

    <!-- Buscador -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control border-primary"
                   placeholder="Buscar por ID o nombre..." onkeyup="filterTable()">
        </div>
    </div>

    <!-- Botones -->
    <div class="row justify-content-center mb-4">
        <div class="col-auto">
            <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#nuevoClienteModal">
                <i class="fas fa-plus me-1"></i> Nuevo
            </button>
            <a href="/web/home" class="btn btn-secondary me-2">
                <i class="fas fa-home me-1"></i> Volver a Inicio
            </a>
            <a href="/api/reportes/clientes-pdf" class="btn btn-danger me-2">
                <i class="fas fa-file-pdf me-1"></i> Reporte PDF
            </a>
            <a href="/api/reportes-excell/clientes" class="btn btn-success">
                <i class="fas fa-file-excel me-1"></i> Reporte Excel
            </a>
        </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="table-responsive">
        <table class="table table-light table-bordered table-hover" id="clienteTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="clienteTableBody">
            </tbody>
        </table>
    </div>

    <!-- Paginación -->
    <div id="paginador" class="d-flex justify-content-center mt-4">
        <nav>
            <ul class="pagination">
                <li id="prevPage" class="page-item disabled">
                    <a class="page-link" href="javascript:void(0)" onclick="cambiarPagina(currentPage - 1)">
                        <i class="fas fa-arrow-left me-1"></i> Anterior
                    </a>
                </li>
                <!-- Los números de página se generarán dinámicamente aquí -->
                <li id="nextPage" class="page-item disabled">
                    <a class="page-link" href="javascript:void(0)" onclick="cambiarPagina(currentPage + 1)">
                        Siguiente <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- Modal Nuevo Cliente -->
<div class="modal fade" id="nuevoClienteModal" tabindex="-1" aria-labelledby="nuevoClienteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="nuevoClienteModalLabel">Nuevo Cliente</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="nuevoClienteForm" onsubmit="crearCliente(event)">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Editar Cliente -->
<div class="modal fade" id="editarClienteModal" tabindex="-1" aria-labelledby="editarClienteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editarClienteModalLabel">Editar Cliente</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editarClienteForm" onsubmit="actualizarCliente(event)">
                    <input type="hidden" id="editId" name="id">
                    <div class="mb-3">
                        <label for="editNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editNombre" name="nombre" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Actualizar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Cliente -->
<div class="modal fade" id="verClienteModal" tabindex="-1" aria-labelledby="verClienteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="verClienteModalLabel">Cliente con Id: </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group list-group-flush" id="clienteDetalles">
                    <li class="list-group-item"><strong>ID:</strong> <span id="detalleId"></span></li>
                    <li class="list-group-item"><strong>Nombre:</strong> <span id="detalleNombre"></span></li>
                    <li class="list-group-item">
                        <strong>Ventas:</strong>
                        <ul id="detalleVentas" class="list-group mt-2"></ul>
                    </li>
                </ul>
                Boundary
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Configuración de paginación
    let currentPage = 0;
    const pageSize = 20;
    let totalPages = 0;

    // Cargar clientes al iniciar
    document.addEventListener('DOMContentLoaded', () => {
        cargarClientes(currentPage);
    });

    // Función para cambiar de página
    function cambiarPagina(nuevaPagina) {
        if (nuevaPagina >= 0 && nuevaPagina < totalPages) {
            currentPage = nuevaPagina;
            cargarClientes(currentPage);
        }
    }

    // Función para generar el paginador
    function generarPaginador(totalPages, currentPage) {
        const pagination = document.querySelector('.pagination');
        const prev = document.getElementById('prevPage');
        const next = document.getElementById('nextPage');

        while (pagination.children.length > 2) {
            pagination.removeChild(pagination.children[1]);
        }

        for (let i = 0; i < totalPages; i++) {
            const li = document.createElement('li');
            li.className = 'page-item' + (i === currentPage ? ' active' : '');
            li.innerHTML = `<a class="page-link" href="javascript:void(0)" onclick="cambiarPagina(${i})">${i + 1}</a>`;
            pagination.insertBefore(li, next);
        }

        prev.classList.toggle('disabled', currentPage === 0);
        next.classList.toggle('disabled', currentPage >= totalPages - 1);
    }

    // Cargar clientes con paginación
    function cargarClientes(page) {
        fetch(`/api/clientes?page=${page}&size=${pageSize}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('clienteTableBody');
                tbody.innerHTML = '';
                totalPages = data.totalPages;

                data.content.forEach(cliente => {
                    const row = `
                        <tr>
                            <td>${cliente.id}</td>
                            <td>${cliente.nombre}</td>
                            <td>
                                <button class="btn btn-sm btn-info me-1" onclick="verCliente(${cliente.id})" data-bs-toggle="modal" data-bs-target="#verClienteModal">
                                    <i class="fas fa-eye"></i> Ver
                                </button>
                                <button class="btn btn-sm btn-primary me-1" onclick="cargarDatosEditar(${cliente.id})">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarCliente(${cliente.id})">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>`;
                    tbody.insertAdjacentHTML('beforeend', row);
                });

                generarPaginador(totalPages, currentPage);
            })
            .catch(error => console.error('Error al cargar clientes:', error));
    }

    // Filtrado en tiempo real
    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#clienteTableBody tr');

        rows.forEach(row => {
            const id = row.cells[0].textContent.toLowerCase();
            const nombre = row.cells[1].textContent.toLowerCase();
            row.style.display = (id.includes(input) || nombre.includes(input)) ? '' : 'none';
        });
    }

    // Validación de formularios
    function validarFormulario(formId) {
        const form = document.getElementById(formId);
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return false;
        }
        return true;
    }

    // Crear cliente
    function crearCliente(event) {
        event.preventDefault();
        if (!validarFormulario('nuevoClienteForm')) return;

        const form = document.getElementById('nuevoClienteForm');
        const data = {
            nombre: form.nombre.value
        };

        fetch('/api/clientes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
            credentials: 'include'
        })
            .then(response => {
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('nuevoClienteModal')).hide();
                    form.reset();
                    cargarClientes(currentPage);
                } else {
                    alert('Error al crear el cliente');
                }
            })
            .catch(error => console.error('Error al crear cliente:', error));
    }

    // Cargar datos para editar
    function cargarDatosEditar(id) {
        fetch(`/api/clientes/${id}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => response.json())
            .then(data => {
                document.getElementById('editId').value = data.id;
                document.getElementById('editNombre').value = data.nombre;
                const modal = new bootstrap.Modal(document.getElementById('editarClienteModal'));
                modal.show();
            })
            .catch(error => console.error('Error al cargar datos:', error));
    }

    // Ver cliente
    function verCliente(id) {
        fetch(`/api/clientes/${id}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => response.json())
            .then(data => {
                document.getElementById('verClienteModalLabel').textContent = `Cliente con Id: ${data.id}`;
                document.getElementById('detalleId').textContent = data.id;
                document.getElementById('detalleNombre').textContent = data.nombre;

                const ventasList = document.getElementById('detalleVentas');
                ventasList.innerHTML = '';
                if (data.ventas && data.ventas.length > 0) {
                    data.ventas.forEach(venta => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.textContent = `ID: ${venta.id}, Fecha: ${venta.fecha}, Total: ${venta.total}`;
                        ventasList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.textContent = 'No hay ventas asociadas';
                    ventasList.appendChild(li);
                }
            })
            .catch(error => {
                console.error('Error al cargar datos del cliente:', error);
                alert('Error al cargar los datos del cliente');
            });
    }

    // Actualizar cliente
    function actualizarCliente(event) {
        event.preventDefault();
        if (!validarFormulario('editarClienteForm')) return;

        const form = document.getElementById('editarClienteForm');
        const id = document.getElementById('editId').value;
        const data = {
            nombre: form.nombre.value
        };

        fetch(`/api/clientes/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
            credentials: 'include'
        })
            .then(response => {
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('editarClienteModal')).hide();
                    cargarClientes(currentPage);
                } else {
                    alert('Error al actualizar el cliente');
                }
            })
            .catch(error => console.error('Error al actualizar cliente:', error));
    }

    // Eliminar cliente
    function eliminarCliente(id) {
        if (confirm('¿Está seguro de eliminar este cliente?')) {
            fetch(`/api/clientes/${id}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include'
            })
                .then(response => {
                    if (response.ok) {
                        cargarClientes(currentPage);
                    } else {
                        alert('Error al eliminar el cliente');
                    }
                })
                .catch(error => console.error('Error al eliminar:', error));
        }
    }
</script>
</body>
</html>
